name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

# Branch-based Pages deploy: build the site, push the result to `gh-pages`,
# let GitHub Pages serve from that branch. Avoids the `github-pages`
# environment (and its protection rules) entirely.
permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install KaTeX (pinned in package.json)
        run: npm install

      - name: Build site
        run: make clean && make

      - name: Stage deploy directory
        run: |
          rm -rf _site
          mkdir -p _site
          cp -r build/. _site/

      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          # Each deploy replaces the previous gh-pages tree (no growing history).
          force_orphan: true
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
          commit_message: "Deploy site: ${{ github.sha }}"